<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Manrope"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "1rem",
              xl: "1.5rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <title>Sign Up Screen</title>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark font-display antialiased"
  >
    <div
      class="relative flex min-h-screen w-full flex-col items-center justify-center p-4"
    >
      <!-- Top Navigation (Mobile Style) -->
      <div
        class="fixed top-0 left-0 right-0 flex items-center bg-transparent p-4 justify-between max-w-[480px] mx-auto w-full"
      >
        <div
          class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center rounded-full bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm shadow-sm cursor-pointer"
        >
          <span class="material-symbols-outlined">arrow_back</span>
        </div>
        <div class="size-10"></div>
        <!-- Spacer for symmetry -->
      </div>
      <!-- Registration Card -->
      <div
        class="w-full max-w-[440px] bg-white dark:bg-slate-900 rounded-xl p-8 shadow-xl shadow-primary/5"
      >
        <div class="flex flex-col items-center mb-8">
          <!-- App Logo/Icon Placeholder -->
          <div
            class="mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-primary/10 text-primary"
          >
            <span class="material-symbols-outlined !text-4xl">task_alt</span>
          </div>
          <h1
            class="text-slate-900 dark:text-slate-100 text-3xl font-bold leading-tight tracking-tight"
          >
            Create Account
          </h1>
          <p
            class="text-slate-500 dark:text-slate-400 mt-2 text-center text-sm"
          >
            Join our minimalist to-do community today
          </p>
        </div>
        <form class="space-y-4">
          <!-- Full Name -->
          <div class="flex flex-col gap-1.5">
            <label
              class="text-slate-700 dark:text-slate-200 text-sm font-semibold px-1"
              >Full Name</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >person</span
                >
              </div>
              <input
                class="w-full pl-11 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary h-14 text-base transition-colors"
                placeholder="Enter your full name"
                type="text"
              />
            </div>
          </div>
          <!-- Email -->
          <div class="flex flex-col gap-1.5">
            <label
              class="text-slate-700 dark:text-slate-200 text-sm font-semibold px-1"
              >Email Address</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400"
              >
                <span class="material-symbols-outlined text-[20px]">mail</span>
              </div>
              <input
                class="w-full pl-11 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary h-14 text-base transition-colors"
                placeholder="name@example.com"
                type="email"
              />
            </div>
          </div>
          <!-- Password -->
          <div class="flex flex-col gap-1.5">
            <label
              class="text-slate-700 dark:text-slate-200 text-sm font-semibold px-1"
              >Password</label
            >
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400"
              >
                <span class="material-symbols-outlined text-[20px]">lock</span>
              </div>
              <input
                class="w-full pl-11 pr-11 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary h-14 text-base transition-colors"
                placeholder="Create a password"
                type="password"
              />
              <div
                class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 cursor-pointer hover:text-primary"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >visibility</span
                >
              </div>
            </div>
          </div>
          <!-- Confirm Password -->
          <div class="flex flex-col gap-1.5">
            <label
              class="text-slate-700 dark:text-slate-200 text-sm font-semibold px-1"
              >Confirm Password</label
            >
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400"
              >
                <span class="material-symbols-outlined text-[20px]"
                  >lock_reset</span
                >
              </div>
              <input
                class="w-full pl-11 pr-11 rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary h-14 text-base transition-colors"
                placeholder="Repeat your password"
                type="password"
              />
            </div>
          </div>
          <div class="pt-4">
            <button
              class="w-full bg-primary hover:bg-primary/90 text-white font-bold h-14 rounded-xl transition-all shadow-lg shadow-primary/25 active:scale-[0.98]"
              type="submit"
            >
              Sign Up
            </button>
          </div>
        </form>
        <!-- Social Sign Up Divider -->
        <div class="my-8 flex items-center">
          <div
            class="flex-grow border-t border-slate-100 dark:border-slate-800"
          ></div>
          <span
            class="mx-4 text-slate-400 text-xs font-medium uppercase tracking-wider"
            >or join with</span
          >
          <div
            class="flex-grow border-t border-slate-100 dark:border-slate-800"
          ></div>
        </div>
        <!-- Social Icons -->
        <div class="flex justify-center gap-4">
          <button
            class="flex h-12 w-12 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
          >
            <svg class="h-5 w-5" viewbox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              ></path>
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              ></path>
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                fill="#FBBC05"
              ></path>
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              ></path>
            </svg>
          </button>
          <button
            class="flex h-12 w-12 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-slate-100"
          >
            <span class="material-symbols-outlined">brand_family</span>
          </button>
        </div>
        <!-- Bottom Link -->
        <div class="mt-8 text-center">
          <p class="text-slate-500 dark:text-slate-400 text-sm">
            Already have an account?
            <a class="text-primary font-bold hover:underline ml-1" href="#"
              >Log In</a
            >
          </p>
        </div>
      </div>
      <!-- Background Decor -->
      <div
        class="fixed -z-10 top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"
      ></div>
      <div
        class="fixed -z-10 bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"
      ></div>
    </div>
  </body>
</html>
