<!DOCTYPE html>

<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#19e66b",
              "background-light": "#f6f8f7",
              "background-dark": "#112117",
            },
            fontFamily: {
              display: ["Manrope"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Manrope", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-background-light dark:bg-background-dark font-display">
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden max-w-[430px] mx-auto shadow-2xl"
    >
      <!-- Top Bar -->
      <div class="flex items-center bg-transparent p-4 pb-2 justify-between">
        <div
          class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start"
        >
          <span class="material-symbols-outlined text-2xl">arrow_back_ios</span>
        </div>
        <h2
          class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12"
        >
          Đăng nhập
        </h2>
      </div>
      <!-- Hero Illustration Area -->
      <div class="@container">
        <div class="@[480px]:px-4 @[480px]:py-3">
          <div
            class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden bg-primary/10 @[480px]:rounded-lg min-h-[240px] relative"
            data-alt="Abstract vibrant green financial growth chart illustration"
            style="
              background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA-47yKrz4w04hoIXiantl5eqeyYHdAgzmLIq-xu_WE8I-qiu-HOqfM--K46odidCCYULvVcAgxDlqOchODXXNMmTgPuOkunf8RGC9-6VXRHCztiAoLGS0pdLliUybnTpoE0H773OSnDpErRkbkozqcxGyD6AcEdgSYYJoP84yOlx_pm9PSe_AW7aA1NSPa_D6cBs4qooAJXfHbDJZ7v5eWqlE2fD2pMA5A1ElQ_fX2F9G97gPgnFRXnypoJkZMeaCppQX6A35dkL4');
            "
          >
            <div
              class="absolute inset-0 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent opacity-60"
            ></div>
          </div>
        </div>
      </div>
      <!-- Welcome Text -->
      <div class="px-6 py-4">
        <h1
          class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-extrabold leading-tight text-center"
        >
          Chào mừng quay lại!
        </h1>
        <p
          class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal pt-2 text-center"
        >
          Quản lý thu chi hiệu quả hơn mỗi ngày cùng MoneyFlow
        </p>
      </div>
      <!-- Login Form -->
      <div class="flex flex-col gap-4 px-6 py-4">
        <label class="flex flex-col w-full">
          <p
            class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pb-2 px-1"
          >
            Email
          </p>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
              >mail</span
            >
            <input
              class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 h-14 pl-12 pr-4 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-all"
              placeholder="name@example.com"
              type="email"
            />
          </div>
        </label>
        <label class="flex flex-col w-full">
          <p
            class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pb-2 px-1"
          >
            Mật khẩu
          </p>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
              >lock</span
            >
            <input
              class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 h-14 pl-12 pr-12 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-all"
              placeholder="••••••••"
              type="password"
            />
            <span
              class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer"
              >visibility</span
            >
          </div>
        </label>
        <div class="flex justify-end">
          <a class="text-primary text-sm font-bold hover:underline" href="#"
            >Quên mật khẩu?</a
          >
        </div>
        <button
          class="w-full bg-primary hover:bg-primary/90 text-slate-900 font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] mt-2"
        >
          Đăng nhập
        </button>
      </div>
      <!-- Divider -->
      <div class="px-6 py-6 flex items-center gap-4">
        <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>
        <span class="text-slate-400 text-xs font-bold uppercase tracking-widest"
          >Hoặc đăng nhập với</span
        >
        <div class="h-px bg-slate-200 dark:bg-slate-800 flex-1"></div>
      </div>
      <!-- Social Login Buttons -->
      <div class="flex gap-4 px-6 pb-8">
        <button
          class="flex-1 flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-800 rounded-xl h-14 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
        >
          <img
            alt="Google Logo"
            class="w-6 h-6"
            data-alt="Google colorful letter G logo"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6VBp5Vn14lYJ2s62W7Ae75zV5_4gxgWm8iEhQogwFwPK6j8Kszc6Ct_bGaeneaDUOUlTdtzOA7kekea4_g6om5-0M4m4NAi3hZiuvzrlprJl0OlBYFPUPbqSao_8oRES7OV0cP9QtLZuIGt9HY1FO7s-InD3BBbJTH7xY9JZEM31EDYm-OObZlrWUpajpnB9vq_8QxtdIjAShKl_FYNUYk_-Ybu75n3jUrX8y-7L64UHX7KEIbwBAzK5p6RKTB0xgeZw9d9CrSLU"
          />
          <span class="text-slate-700 dark:text-slate-200 font-semibold"
            >Google</span
          >
        </button>
        <button
          class="flex-1 flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-800 rounded-xl h-14 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
        >
          <span
            class="material-symbols-outlined text-2xl text-slate-900 dark:text-white"
            >ios</span
          >
          <span class="text-slate-700 dark:text-slate-200 font-semibold"
            >Apple</span
          >
        </button>
      </div>
      <!-- Footer -->
      <div class="mt-auto px-6 py-8 text-center">
        <p class="text-slate-500 dark:text-slate-400 text-sm">
          Bạn chưa có tài khoản?
          <a class="text-primary font-bold hover:underline" href="#"
            >Đăng ký ngay</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
